<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swachh Palle // Administrative Access</title>
  <!-- Google Fonts - Inter & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css?v=3">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="login-body" style="display: none;">

  <div class="login-wrapper">
    <div class="login-card-container">
      
      <!-- Branding & Title -->
      <div class="login-brand-header">
        <div class="brand-logo">
          <span class="material-symbols-outlined">eco</span>
        </div>
        <h2>Swachh Palle</h2>
        <p>Triage Management Control Center</p>
      </div>

      <!-- Authentication Form -->
      <form id="admin-login-form">
        <div class="form-group-field">
          <label for="admin-email">Email Address</label>
          <input type="email" id="admin-email" placeholder="admin@swachhpalle.gov.in" required autocomplete="email">
        </div>
        
        <div class="form-group-field">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="form-group-field" id="confirm-password-group" style="display: none;">
          <label for="admin-confirm-password">Confirm Password</label>
          <input type="password" id="admin-confirm-password" placeholder="••••••••" autocomplete="new-password">
        </div>

        <div id="auth-error-msg" class="auth-error-block" style="display: none;">
          Authentication Failure. Please verify your credentials and try again.
        </div>

        <button type="submit" id="btn-login-submit" class="btn-primary-action">
          Sign In to Portal
        </button>

        <div style="text-align: center; margin-top: 18px; display: flex; flex-direction: column; gap: 8px;">
          <a href="#" id="toggle-auth-mode" style="color: var(--primary); font-size: 13px; text-decoration: none; font-weight: 600; font-family: var(--font-sans);">Need to register? Create Admin Account</a>
        </div>
      </form>

      <div class="login-card-footer">
        <p>Restricted municipal service. Unauthorized access is strictly logged and audited.</p>
      </div>

    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBeoLlBQvDk6XHHUrTiFX-a7zve2esq8cU",
      authDomain: "swachh-palle-c780c.firebaseapp.com",
      projectId: "swachh-palle-c780c",
      storageBucket: "swachh-palle-c780c.firebasestorage.app",
      messagingSenderId: "578766992770",
      appId: "1:578766992770:web:e2731c52dc35e45d708b9b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginForm = document.getElementById('admin-login-form');
    const emailInput = document.getElementById('admin-email');
    const passwordInput = document.getElementById('admin-password');
    const confirmPasswordGroup = document.getElementById('confirm-password-group');
    const confirmPasswordInput = document.getElementById('admin-confirm-password');
    const errorMsg = document.getElementById('auth-error-msg');
    const btnSubmit = document.getElementById('btn-login-submit');
    const toggleAuthMode = document.getElementById('toggle-auth-mode');
    const formTitle = document.querySelector('.login-brand-header h2');
    const formSub = document.querySelector('.login-brand-header p');

    let isRegisterMode = false;

    // Monitor Auth State - if already logged in, redirect to dashboard
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      } else {
        document.body.style.display = 'flex';
      }
    });

    toggleAuthMode.addEventListener('click', (e) => {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      
      if (isRegisterMode) {
        formTitle.textContent = 'Create Admin Account';
        formSub.textContent = 'Register a new administrative console user';
        confirmPasswordGroup.style.display = 'flex';
        confirmPasswordInput.required = true;
        btnSubmit.textContent = 'Create Admin Account';
        toggleAuthMode.textContent = 'Already have an account? Sign In';
        passwordInput.placeholder = 'At least 6 characters';
      } else {
        formTitle.textContent = 'Swachh Palle';
        formSub.textContent = 'Triage Management Control Center';
        confirmPasswordGroup.style.display = 'none';
        confirmPasswordInput.required = false;
        confirmPasswordInput.value = '';
        btnSubmit.textContent = 'Sign In to Portal';
        toggleAuthMode.textContent = 'Need to register? Create Admin Account';
        passwordInput.placeholder = '••••••••';
      }
      errorMsg.style.display = 'none';
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = isRegisterMode ? 'Creating Account...' : 'Authenticating...';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (isRegisterMode) {
        const confirmPassword = confirmPasswordInput.value;
        if (password !== confirmPassword) {
          errorMsg.textContent = 'Registration Failed: Passwords do not match.';
          errorMsg.style.display = 'block';
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Create Admin Account';
          return;
        }
        if (password.length < 6) {
          errorMsg.textContent = 'Registration Failed: Password must be at least 6 characters.';
          errorMsg.style.display = 'block';
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Create Admin Account';
          return;
        }
      }

      try {
        if (isRegisterMode) {
          await auth.createUserWithEmailAndPassword(email, password);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        // Successful login will trigger onAuthStateChanged redirect
      } catch (err) {
        console.error('Auth error:', err);
        errorMsg.textContent = `${isRegisterMode ? 'Registration' : 'Login'} Failed: ${err.message}`;
        errorMsg.style.display = 'block';
        btnSubmit.disabled = false;
        btnSubmit.textContent = isRegisterMode ? 'Create Admin Account' : 'Sign In to Portal';
      }
    });


  </script>
</body>
</html>
